<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Student Hub Portal</title>
    <link rel="stylesheet" href="class.css">
</head>

<body>

<header>

        <img src="studenthub.png" alt="Student Hub Logo" class="studenthub" align="left" width="150" height="100">
<h1>Student Hub Portal</h1>

<nav>

<ul>

<li><a href="index.html">Home</a></li>

<li><a href="login.html">Login</a></li>

<li><a href="signup.html" class="active">

Sign Up

</a></li>

</ul>

</nav>

</header>

<main>

<div class="auth-container">

<h2>Create Your Account</h2>

<p class="subtitle">

Join Student Hub Portal

</p>

<form action="home.html">

<label>Full Name</label>

<input
type="text"
placeholder="Enter Full Name"
required>

<label>Email Address</label>

<input
type="email"
placeholder="Enter Email"
required>

<label>Username</label>

<input
type="text"
placeholder="Choose Username"
required>

<label>Password</label>

<input
type="password"
placeholder="Create Password"
required>

<label>Confirm Password</label>

<input
type="password"
placeholder="Confirm Password"
required>

<input
type="submit"
value="Create Account">

</form>

<div class="auth-links">

<p>

Already have an account?

<a href="login.html">

Login

</a>

</p>

</div>

</div>

</main>

<footer>

<p>

© 2026 Student Hub Portal

</p>

</footer>

</body>

</html>
