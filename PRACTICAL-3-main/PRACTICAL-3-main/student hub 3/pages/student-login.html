<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - StudentHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header class="site-header">
    <div class="container">

        <div class="brand">
            <img src="../images/logo.png" alt="StudentHub logo">
            <h1>StudentHub</h1>
        </div>

        <nav aria-label="Main navigation">
            <ul class="nav-list">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="faq.html">FAQ</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="login.html" aria-current="page">Login</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </nav>

    </div>
</header>


<main>

    <section class="section">
        <div class="container">

            <div class="form-card">

                <h2>Student Login</h2>

                <p>
                    Login to access your StudentHub dashboard.
                </p>

                <!-- Practical 3: Static page navigation -->
                <form action="student-dashboard.html" method="get">

                    <div class="form-group">
                        <label for="student-id">Student ID</label>
                        <input
                            type="text"
                            id="student-id"
                            name="student_id"
                            placeholder="Enter your Student ID"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="student-password">Password</label>
                        <input
                            type="password"
                            id="student-password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <button type="submit" class="btn">
                            Login
                        </button>
                    </div>

                </form>


                <p>
                    Don't have an account?
                    <a href="register.html">Register here</a>
                </p>

                <p>
                    <a href="login.html">← Back to Login Options</a>
                </p>

            </div>

        </div>
    </section>

</main>


<footer class="site-footer">
    <div class="container">
        <p>&copy; 2026 StudentHub. All rights reserved.</p>
    </div>
</footer>

</body>
</html>
